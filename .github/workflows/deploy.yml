name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel (after CI passes)
    runs-on: ubuntu-latest
    needs: []   # Se ejecuta solo en pushes a main; el CI ya validó la calidad

    defaults:
      run:
        working-directory: TP-Ahorcado

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: TP-Ahorcado/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de produccion
        run: npm run build

      - name: Deploy a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: TP-Ahorcado
          vercel-args: "--prod"
