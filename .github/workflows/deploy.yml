name: Deploy to Vercel

# Las variables de entorno en el nivel del job son como lo indica la doc oficial
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    # IMPORTANTE: NO usar working-directory global.
    # Los comandos de Vercel CLI deben correr desde la RAIZ del repo.
    # Vercel usa el Root Directory configurado en el proyecto (TP-Ahorcado) internamente.
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull configuracion del proyecto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build con Vercel (genera .vercel/output)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a produccion
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
